# bosona-tracker configuration. No secrets here: every source is public and read-only.
# Any value can be overridden via environment variables or a local .env file (see .env.example).

user: "0xc2ad03f79ca3f3c17d8c7de2612ce0c89b7d40ed"   # proxy wallet of @bosona

db_path: data/bosona.db
log_dir: logs
log_level: INFO

api:
  data: https://data-api.polymarket.com
  gamma: https://gamma-api.polymarket.com
  clob: https://clob.polymarket.com
  binance: https://data-api.binance.vision     # market-data-only mirror (api.binance.com is geo-blocked from some regions)

http:
  timeout_s: 30
  max_retries: 6
  backoff_base_s: 1.0
  backoff_max_s: 60
  user_agent: "bosona-tracker/0.1 (read-only research)"

# Requests per second per host. Documented limits are per 10 s windows
# (Data API v2: 800/10 s overall, /v2/activity 200/10 s; Gamma /markets 300/10 s, /events 500/10 s),
# we stay well below them.
rate_limits:
  data-api.polymarket.com: 8
  gamma-api.polymarket.com: 12
  clob.polymarket.com: 40         # /prices-history: 1000 req / 10 s documented
  data-api.binance.vision: 30     # klines weight 2, 6000 weight / min per IP

sync:
  history_start: 1          # /v2 feeds: start=1 means "full history" (0 would floor to 3 years back)
  overlap_s: 3600           # incremental runs re-read this much before the last synced second
  safety_lag_s: 120         # never sync the newest seconds: the Data API ingests with a small lag
  window_days: 7            # full-history walk is split into windows walked in parallel
  concurrency: 4            # parallel windows
  page_limit: 1000          # /v2 max page size
  gamma_batch: 50           # condition ids / slugs per Gamma request

fees:
  crypto_rate: 0.07         # fee = size * rate * p * (1 - p), takers only (docs.polymarket.com/trading/fees)

spot:
  cache_dir: data/spot            # Binance 1s closes, one .npz per symbol-day
  concurrency: 12                 # symbol-days fetched in parallel
  lookback_s: 1200                # history needed before each window (15-min volatility + TWAP margin)

prices:
  concurrency: 16                 # CLOB /prices-history requests in flight
  pre_window_s: 300               # token price history fetched for [window_start - pre, window_end + post]
  post_window_s: 120

# Stage 3: live tracker (`python -m bosona track`). Every source is public; nothing here is a secret.
live:
  db_path: data/live.db                 # separate from bosona.db: small writes every 0.5 s, never blocked by batch jobs
  assets: [btc, eth, sol, xrp, doge, bnb]
  detectors: [rtds_activity, chain_logs, data_api]   # all run at once; the first sighting wins, each one's latency is kept
  data_api_poll_s: 3                    # /v2/activity: 200 req / 10 s allowed, we use 1 / 3 s
  rtds_url: wss://ws-live-data.polymarket.com
  rpc_ws: wss://polygon-bor-rpc.publicnode.com        # eth_subscribe logs + newHeads
  rpc_http: https://polygon-bor-rpc.publicnode.com    # back-fill after reconnects, late block timestamps
  clob_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  timeframes: [5m, 15m, 1h, 4h, 1d]     # open windows whose metadata is fetched ahead (token -> market without a lookup)
  book_series: [btc:5m, btc:15m, btc:1h, eth:5m]  # ~88% of his fills; books streamed from the market channel.
                                        # Other markets: REST /book at detection, then streamed for 15 min after a fill.
                                        # Each BTC window is ~100 book updates/s: a too wide set gets the socket closed
                                        # by the server (1013 slow consumer).
  window_lead_s: 60                     # subscribe to the next window this long before it opens
  book_depth: 10                        # levels per side kept in snapshots
  close_timeframes: [5m, 15m, 4h]       # Chainlink-resolved windows: Binance vs Chainlink recorded at every close
  close_delay_s: 3                      # RTDS Chainlink ticks arrive ~1.5 s after their timestamp
  finalize_after_s: 30                  # reference values are computed once the slower channels have reported
  price_ring_s: 1200                    # in-memory price history (per-second values are also stored in live.db)
  stale_s: 10                           # a provider without ticks for this long is reported as down
  price_providers: [binance_ws, chainlink_rtds, chainlink_data_streams]
  providers:
    binance_ws:
      url: wss://data-stream.binance.vision        # aggTrade of <asset>usdt
    chainlink_rtds:
      url: wss://ws-live-data.polymarket.com       # legacy topics, removal planned ~2026-10-23; Binance keeps running
      topics: [crypto_prices_chainlink, crypto_prices_twap_sixty]
    chainlink_data_streams:                        # off until CHAINLINK_DS_API_KEY / CHAINLINK_DS_USER_SECRET are in .env
      ws_url: wss://ws.dataengine.chain.link
      feeds:                                       # "<asset>:<kind>": feed id (or CHAINLINK_DS_FEEDS in .env)
        "btc:spot": "0x00039d9e45394f473ab1f050a1b963e6b05351e52d71e507509ada0c95ed75b8"   # BTC/USD (example in @chainlink/data-streams-sdk)

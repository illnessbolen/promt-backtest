[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosona-tracker"
version = "0.1.0"
description = "Read-only collection and analysis of Polymarket trader @bosona's trades"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "websockets>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bosona = "bosona.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
